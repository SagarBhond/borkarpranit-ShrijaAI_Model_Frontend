name: CI/CD - Frontend (ShrijaAI_Model_Frontend)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 3 }

  deploy-ec2:
    if: github.ref == 'refs/heads/main'
    needs: build-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::882040517001:role/hrms-frontend-github-actions
          aws-region: ap-south-1
      - name: Fetch frontend deployment credentials
        run: |
          set -euo pipefail
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id hrms/frontend-deploy \
            --query SecretString \
            --output text)"
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$secret_json" | jq -er '.private_key' > "$RUNNER_TEMP/frontend-deploy-key"
          chmod 600 "$RUNNER_TEMP/frontend-deploy-key"
          printf '%s' "$secret_json" | jq -er '.known_hosts' > "$RUNNER_TEMP/frontend-known-hosts"
          chmod 600 "$RUNNER_TEMP/frontend-known-hosts"
          printf 'FRONTEND_EC2_HOST=%s\n' "$(printf '%s' "$secret_json" | jq -er '.host')" >> "$GITHUB_ENV"
          printf 'FRONTEND_EC2_USER=%s\n' "$(printf '%s' "$secret_json" | jq -er '.username // "ec2-user"')" >> "$GITHUB_ENV"
      - name: Deploy static site to EC2
        env:
          FRONTEND_SSH_KEY_FILE: ${{ runner.temp }}/frontend-deploy-key
          FRONTEND_KNOWN_HOSTS_FILE: ${{ runner.temp }}/frontend-known-hosts
        run: bash ./scripts/deploy-frontend.sh dist
